name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-boards:
    name: Discover Available Boards
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.list-boards.outputs.boards }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover board directories
        id: list-boards
        run: |
          BOARDS_JSON=$(python tools/setboard.py --json)
          echo "Discovered boards: $BOARDS_JSON"
          echo "boards=$BOARDS_JSON" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.board }})
    needs: discover-boards
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.0
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.discover-boards.outputs.boards) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mark git workspace as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup ESP-IDF environment
        run: |
          if [ -f "$IDF_PATH/export.sh" ]; then
            . "$IDF_PATH/export.sh"
          elif [ -f /opt/esp/idf/export.sh ]; then
            . /opt/esp/idf/export.sh
          elif [ -f /opt/esp-idf/export.sh ]; then
            . /opt/esp-idf/export.sh
          fi
          echo "$PATH" | tr ':' '\n' | while read -r p; do
            if [ -n "$p" ] && [ -d "$p" ]; then
              echo "$p" >> "$GITHUB_PATH"
            fi
          done
          echo "IDF_PATH=$IDF_PATH" >> "$GITHUB_ENV"
          if [ -n "$IDF_TOOLS_PATH" ]; then
            echo "IDF_TOOLS_PATH=$IDF_TOOLS_PATH" >> "$GITHUB_ENV"
          fi
          if [ -n "$IDF_PYTHON_ENV_PATH" ]; then
            echo "IDF_PYTHON_ENV_PATH=$IDF_PYTHON_ENV_PATH" >> "$GITHUB_ENV"
          fi

      - name: Build and Package Firmware
        run: |
          if [ -f "$IDF_PATH/export.sh" ]; then
            . "$IDF_PATH/export.sh"
          elif [ -f /opt/esp/idf/export.sh ]; then
            . /opt/esp/idf/export.sh
          elif [ -f /opt/esp-idf/export.sh ]; then
            . /opt/esp-idf/export.sh
          fi

          BOARD="${{ matrix.board }}"
          echo "=== Configuring board: ${BOARD} ==="
          python tools/setboard.py "${BOARD}"

          echo "=== Cleaning build cache ==="
          idf.py fullclean

          echo "=== Building firmware for ${BOARD} ==="
          idf.py build

          echo "=== Packaging binary outputs for ${BOARD} ==="
          mkdir -p dist

          # 1. Firmware without bootloader (.bin specifically)
          cp build/eos.bin "dist/eos-${BOARD}-without-bootloader.bin"

          # 2. Firmware with bootloader (.bin specifically, merged with bootloader and partition table)
          python tools/merge_bin.py "dist/eos-${BOARD}-with-bootloader.bin" build

      - name: Upload board binaries
        uses: actions/upload-artifact@v4
        with:
          name: eos-binaries-${{ matrix.board }}
          path: |
            dist/eos-${{ matrix.board }}-without-bootloader.bin
            dist/eos-${{ matrix.board }}-with-bootloader.bin
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [discover-boards, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all board artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: eos-binaries-*
          merge-multiple: true

      - name: Inspect release assets
        run: |
          echo "Release assets ready for publication:"
          ls -lah release-assets/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.bin
          generate_release_notes: true
          draft: false
          prerelease: false
